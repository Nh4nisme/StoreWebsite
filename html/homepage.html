<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Homepage</title>
    <link rel="stylesheet" href="../css/bootstrap.css">
    <script src="../js/bootstrap.js"></script>
    <script src="../js/jquery.js"></script>
    <link rel="stylesheet" href="../css/homepage.css">
</head>

<body>
    <div class="container-fluid p-0">
        <div class="row g-0">
            <!-- Sidebar -->
            <div class="sidebar">
                <div class="logo">
                    <img src="../img/logo.svg" alt="" id="img-logo">
                </div>
                <ul class="nav flex-column" style="margin-left: 15px;">
                    <li class="nav-item">
                        <a class="nav-link active" href="#" data-content="dashboard" data-title="Dashboard">
                            <i class="nav-icon bi bi-layers"></i>
                            Dashboard
                        </a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link" href="#" data-content="products" data-title="Products">
                            <i class="nav-icon bi bi-box-seam"></i>
                            Products
                        </a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link" href="#" data-content="orders" data-title="Orders">
                            <i class="nav-icon bi bi-file-earmark-text"></i>
                            Orders
                        </a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link" href="#" data-content="accounts" data-title="Account">
                            <i class="nav-icon bi bi-people"></i>
                            Accounts
                        </a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link" href="#" data-content="onboard" data-title="Onboard">
                            <i class="nav-icon bi bi-play-circle"></i>
                            Onboard
                        </a>
                    </li>
                </ul>
            </div>

            <!-- Main Content -->
            <div class="content">
                <!-- Phần tiêu đề thay đổi theo từng thẻ li -->
                <div class="row mb-4">
                    <div class="col-md-8">
                        <h1 class="page-title">Dashboard</h1>
                    </div>
                    <div class="col-md-4">
                        <div class="employee-box">
                            <div class="employee-icon">
                                <i class="bi bi-person"></i>
                            </div>
                            <div>
                                <h5 class="mb-0">Employees</h5>
                                <small>27</small>
                            </div>
                        </div>
                    </div>
                </div>

                <!-- Dashboard Content -->
                <div class="content-section" id="dashboard-content">
                    <!-- Thêm nội dung phần Dashboard vào đây -->
                </div>

                <!-- Products Content -->
                <div class="content-section" id="products-content" style="display: none;">
                    <!-- Thêm nội dung phần Products vào đây -->
                </div>

                <!-- Orders Content -->
                <div class="content-section" id="orders-content" style="display: none;">
                    <!-- Thêm nội dung phần Orders vào đây -->
                </div>

                <!-- Accounts Content -->
                <div class="content-section" id="accounts-content" style="display: none;">
                    <!-- Thêm nội dung phần Account vào đây -->
                </div>

                <!-- Onboard Content -->
                <div class="content-section" id="onboard-content" style="display: none;">
                    <!-- Thêm nội dung phần Onboard vào đây -->
                </div>
            </div>
        </div>
    </div>

    <!-- Bootstrap Icons -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.8.1/font/bootstrap-icons.css">
    <script>
        $(document).ready(function () {
            // Animation Hover thanh nav
            $(".nav-link").hover(function () {
                $(this).animate({ left: 0 }, 200);
            }, function () {
                $(this).animate({ left: -10 }, 200);
            });

            // Chức năng chuyển nội dung
            $(".nav-link").click(function (e) {
                e.preventDefault();

                // Ẩn các phần đang active
                $(".nav-link").removeClass("active");

                // Thêm lớp active vào link
                $(this).addClass("active");

                // Gán nội dung hiển thị
                var contentId = $(this).data("content");

                // Chuyển nội dung tiêu đề 
                var pageTitle = $(this).data("title");
                $(".page-title").text(pageTitle);

                // Ẩn tất cả nội dungdung
                $(".content-section").hide();

                // Hiện nội dung được chọn
                $("#" + contentId + "-content").show();
            });
        });
    </script>
</body>

</html>
